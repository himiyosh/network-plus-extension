name: Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creating the release and uploading its archive is the only write this
      # workflow performs; every other job in the repository stays read-only.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag push releases exactly that tag; a merge into main releases the
      # version the repository currently declares, so a reviewed version bump is
      # all it takes. Either way the tag and package.json version must agree.
      - name: Resolve the release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "tag $tag does not match package.json version $version"
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved release tag $tag"

      # Re-running for a version that is already published must never republish
      # or overwrite it, so the run stops here instead of failing the branch.
      - name: Skip versions that are already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "release $TAG_NAME already exists; refusing to overwrite a published release"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package versions
        if: steps.existing.outputs.published == 'false'
        run: npm run version:check

      - name: Check extension package
        if: steps.existing.outputs.published == 'false'
        run: npm run extension:check

      - name: Build extension package
        if: steps.existing.outputs.published == 'false'
        run: npm run extension:package

      - name: Check store submission kits
        if: steps.existing.outputs.published == 'false'
        run: npm run store:check

      - name: Check that the archive matches the digest published in the store kits
        if: steps.existing.outputs.published == 'false'
        run: |
          version="$(node -p "require('./package.json').version")"
          archive="dist/network-plus-extension-$version.zip"
          expected="$(node -p "require('./scripts/check-store-readiness.js').EXPECTED_RELEASE_SHA256")"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "archive digest $actual does not match the digest recorded in the submission dossiers ($expected)"
            exit 1
          fi
          echo "archive digest verified: $actual"

      - name: Build release notes
        if: steps.existing.outputs.published == 'false'
        run: node scripts/build-release-notes.js > release-notes.md

      - name: Publish the release
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="dist/network-plus-extension-$VERSION.zip"
          # gh creates the tag at this commit when the ref is a branch push.
          gh release create "$TAG_NAME" \
            "$archive#Network+ $TAG_NAME extension ZIP" \
            --target "$GITHUB_SHA" \
            --title "Network+ $TAG_NAME" \
            --notes-file release-notes.md
