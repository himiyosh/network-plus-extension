name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Check changed text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run text:check -- --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Run browser source-contract policy
        run: npx jest tests/browser-availability-policy.test.js --runInBand --coverage=false

      - name: Run Jest
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint

      - name: Check package versions
        run: npm run version:check

      - name: Check formatting
        run: npm run format:check

      - name: Check extension package
        run: npm run extension:check

      - name: Build extension package
        run: npm run extension:package

      - name: Check Edge Add-ons submission kit
        run: npm run store:check

      - name: Check repository integrity
        run: npm run integrity:check

      - name: Audit dependencies
        run: npm run audit:strict

      - name: Check coordinator contract
        run: npm run contract:check

      - name: Check independent review marker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INDEPENDENT_REVIEW_REVIEWER_SESSION_ID: ${{ vars.INDEPENDENT_REVIEW_REVIEWER_SESSION_ID }}
          INDEPENDENT_REVIEW_MERGER_SESSION_ID: ${{ vars.INDEPENDENT_REVIEW_MERGER_SESSION_ID }}
        run: node scripts/check-independent-review.js
