<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Network+ Safe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="panel.css"/>
</head>
<body>
  <header class="topbar">
    <div class="left">
      <strong>Network+ (safe)</strong>
      <input id="filterInput" type="text" placeholder="Filter (URL, method, status, type)"/>
      <button id="clearBtn">Clear</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div class="right">
      <button id="exportCsvBtn">Export CSV</button>
      <button id="exportHarBtn">Export HAR</button>
      <button id="wideBtn">Wide</button>
      <button id="themeBtn">Theme: System</button>
    </div>
  </header>
  <main class="content" id="content">
    <section class="tableWrap">
      <table class="grid" id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <aside class="details" id="details">
      <div class="details-header"><div id="detailsTitle">Select a request…</div></div>
      <div class="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="headers">Headers</button>
        <button class="tab" data-tab="request">Request</button>
        <button class="tab" data-tab="response">Response</button>
        <button class="tab" data-tab="timing">Timing</button>
      </div>
      <div class="tabpanes">
        <div class="pane active" id="pane-overview"></div>
        <div class="pane" id="pane-headers"></div>
        <div class="pane" id="pane-request"></div>
        <div class="pane" id="pane-response"></div>
        <div class="pane" id="pane-timing"></div>
      </div>
    </aside>
  </main>
  <footer class="statusbar"><span id="statusText">Loaded</span><span class="spacer"></span><span id="counter">0 requests</span></footer>
  <script src="panel.js"></script>
</body>
</html>
