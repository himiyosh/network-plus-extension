<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Network+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="panel.css"/>
</head>
<body>
  <header class="topbar">
    <div class="left">
      <strong>Network+</strong>
      <input id="filterInput" type="text" placeholder="Filter (URL, method, status, type)"/>
      <button id="clearBtn">Clear</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div class="right">
      <button id="exportCsvBtn">Export CSV</button>
      <button id="exportHarBtn">Export HAR</button>
      <button id="themeBtn">Theme: System</button>
    </div>
  </header>
  <main class="content" id="content">
    <section class="tableWrap" id="tableWrap">
      <table class="grid" id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <div class="resizer" id="resizer"></div>
    <aside class="details" id="details">
      <div class="details-header"><div id="detailsTitle">Select a request…</div></div>
      <div class="accordion" id="detailsAccordion">
        <div class="accordion-item">
          <button class="accordion-header"><span class="indicator"></span>Overview</button>
          <div class="accordion-content" id="pane-overview"></div>
        </div>
        <div class="accordion-item">
          <button class="accordion-header"><span class="indicator"></span>Headers</button>
          <div class="accordion-content" id="pane-headers"></div>
        </div>
        <div class="accordion-item">
          <button class="accordion-header"><span class="indicator"></span>Request</button>
          <div class="accordion-content" id="pane-request"></div>
        </div>
        <div class="accordion-item">
          <button class="accordion-header"><span class="indicator"></span>Response</button>
          <div class="accordion-content" id="pane-response"></div>
        </div>
        <div class="accordion-item">
          <button class="accordion-header"><span class="indicator"></span>Timing</button>
          <div class="accordion-content" id="pane-timing"></div>
        </div>
      </div>
    </aside>
  </main>
  <footer class="statusbar"><span id="statusText">Loaded</span><span class="spacer"></span><span id="counter">0 requests</span></footer>
  <script src="panel.js"></script>
</body>
</html>
