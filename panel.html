<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Network+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="panel.css"/>
</head>
<body>
  <header class="topbar">
    <div class="left">
      <strong>Network+</strong>
      <input id="filterInput" type="text" placeholder="Filter requests..."/>
      <div class="separator"></div>
      <button id="clearBtn" title="Clear requests" class="icon-btn">🚫</button>
      <button id="pauseBtn" title="Pause recording" class="icon-btn">⏸️</button>
      <button id="importBtn" title="Import (HAR/SAZ)" class="icon-btn">📥</button>
      <button id="exportHarBtn" title="Export (HAR)" class="icon-btn">📤</button>
      <input type="file" id="importFile" accept=".har,.saz" style="display:none" />
      <div class="separator"></div>
      <button id="deepSearchBtn" title="Deep Search (Ctrl+F)" class="icon-btn">🔍</button>
    </div>
    <div class="right">
      <button id="filterBtn">⚙️ Filters</button>
      <button id="columnsBtn">🗂️ Columns</button>
      <button id="themeBtn">🌗 System</button>
    </div>
  </header>
  <div class="deep-search-bar" id="deepSearchBar" style="display:none">
    <div class="deep-search-left">
      <input id="deepSearchInput" type="text" placeholder="Search in request/response bodies, headers..." />
      <span id="deepSearchCount" class="deep-search-count"></span>
      <button id="deepSearchPrev" class="deep-search-nav" title="Previous match (Shift+Enter)">&#9650;</button>
      <button id="deepSearchNext" class="deep-search-nav" title="Next match (Enter)">&#9660;</button>
    </div>
    <div class="deep-search-right">
      <label class="deep-search-scope"><input type="checkbox" id="dsReqBody" checked /> Req Body</label>
      <label class="deep-search-scope"><input type="checkbox" id="dsResBody" checked /> Res Body</label>
      <label class="deep-search-scope"><input type="checkbox" id="dsReqHeaders" checked /> Req Headers</label>
      <label class="deep-search-scope"><input type="checkbox" id="dsResHeaders" checked /> Res Headers</label>
      <button id="deepSearchClose" class="deep-search-close" title="Close (Esc)">&times;</button>
    </div>
  </div>
  <main class="content" id="content">
    <section class="tableWrap" id="tableWrap">
      <table class="grid" id="grid">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <div class="resizer" id="resizer"></div>
    <aside class="details" id="details">
      <div class="details-header"><div id="detailsTitle">Select a request...</div></div>
      <div class="inspector-panels">
        <div class="inspector-half" id="inspector-request">
          <div class="inspector-label">Request</div>
          <div class="tab-bar" id="req-tab-bar">
            <button class="tab-btn active" data-tab="req-headers">Headers</button>
            <button class="tab-btn" data-tab="req-body">Body</button>
            <button class="tab-btn" data-tab="req-query">Query</button>
            <button class="tab-btn" data-tab="req-cookies">Cookies</button>
            <button class="tab-btn" data-tab="req-raw">Raw</button>
          </div>
          <div class="tab-content-area">
            <div class="tab-pane active" id="req-headers"></div>
            <div class="tab-pane" id="req-body"></div>
            <div class="tab-pane" id="req-query"></div>
            <div class="tab-pane" id="req-cookies"></div>
            <div class="tab-pane" id="req-raw"></div>
          </div>
        </div>
        <div class="inspector-divider" id="inspector-divider"></div>
        <div class="inspector-half" id="inspector-response">
          <div class="inspector-label">Response</div>
          <div class="tab-bar" id="res-tab-bar">
            <button class="tab-btn active" data-tab="res-headers">Headers</button>
            <button class="tab-btn" data-tab="res-body">Body</button>
            <button class="tab-btn" data-tab="res-preview">Preview</button>
            <button class="tab-btn" data-tab="res-cookies">Cookies</button>
            <button class="tab-btn" data-tab="res-timing">Timing</button>
            <button class="tab-btn" data-tab="res-raw">Raw</button>
          </div>
          <div class="tab-content-area">
            <div class="tab-pane active" id="res-headers"></div>
            <div class="tab-pane" id="res-body"></div>
            <div class="tab-pane" id="res-preview"></div>
            <div class="tab-pane" id="res-cookies"></div>
            <div class="tab-pane" id="res-timing"></div>
            <div class="tab-pane" id="res-raw"></div>
          </div>
        </div>
      </div>
    </aside>
  </main>
  <footer class="statusbar"><span id="statusText">Loaded</span><span class="spacer"></span><span id="selectedSize"></span><span id="totalSize"></span><span id="counter">0 requests</span></footer>
  <script src="vendor/fflate.js"></script>
  <script src="panel.js"></script>
</body>
</html>
